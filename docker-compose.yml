services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pehchan
      POSTGRES_PASSWORD: pehchan
      POSTGRES_DB: pehchan
    ports:
      - "5432:5432"
    volumes:
      - pehchan-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pehchan -d pehchan"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pehchan-postgres:
